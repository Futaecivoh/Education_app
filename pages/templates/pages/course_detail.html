{% extends 'pages/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<main class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <h1 class="display-5 fw-bold text-primary mb-3">{{ course.title }}</h1>
                    <p class="text-muted mb-4">Опубликовано: {{ course.created_at|date:"d.m.Y" }}</p>
                    
                    <h4 class="fw-bold mb-3">О программе:</h4>
                    <p class="fs-5 mb-5">{{ course.description|linebreaks }}</p>
                    
                    <hr class="my-4">
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <h3 class="fw-bold text-success mb-0">Цена: {{ course.price }} руб.</h3>
                        
                        <div>
                            <a href="{% url 'course_update' course.pk %}" class="btn btn-warning btn-lg me-2">Редактировать</a>
                            <a href="{% url 'materials' %}" class="btn btn-outline-secondary btn-lg">Назад</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
