{% extends 'pages/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<main class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <h2 class="fw-bold text-center mb-4 text-primary">Напишите нам</h2>
                    <p class="text-center text-muted mb-4">У вас остались вопросы? Заполните форму ниже, и мы свяжемся с вами!</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        {{ form.as_p }}
                        
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Отправить сообщение</button>
                        </div>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
