{% extends 'pages/base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<main class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm p-4 border-0 bg-light">
                
                <h2 class="text-center mb-4 text-success fw-bold">Регистрация</h2>
                
                <form method="post">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-success w-100 btn-lg mt-3">Зарегистрироваться</button>
                    
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
