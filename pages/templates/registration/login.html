{% extends 'pages/base.html' %}
{% block title %}Вход на сайт{% endblock %}
{% block content %}
<main class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm p-4 border-0 bg-light">
                <h2 class="text-center mb-4 text-primary fw-bold">Вход</h2>
                <form method="post">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="row mb-3 align-items-center">
                            
                            <label class="col-sm-4 col-form-label fw-bold text-secondary text-end">
                                {{ field.label }}
                            </label>
                            
                            <div class="col-sm-8">
                                {{ field }}
                                
                                {% if field.errors %}
                                    <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                                {% endif %}
                            </div>
                            
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary w-100 btn-lg mt-3">Войти</button>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
